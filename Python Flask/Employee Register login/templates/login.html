<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Register Login</title>
    <link rel="stylesheet" href="{{url_for('static',filename='index.css')}}">
</head>
<body>
    <div class="reg-login-container">
        <div class="welcome-text-section">
            <h1 id="heading">Welcome Our Strenghts </h1>
        </div>
        <div class="login-section">
            <fieldset>
                <legend>Please Login</legend>
                <form action="/login" method="post">
                    <input type="text" id="empName" name="employeeName" placeholder="Enter Your Name" required>
                    <input type="password" id="empPassword" name="empPassword" placeholder="Enter Your Password" required>
                    <input type="submit" value="Login">
                    <p id="reg-para">Don't have an Account ? <a href="/register">Click to Register</a></p>
                </form>
            </fieldset>
        </div>
    </div>
</body>
</html>
